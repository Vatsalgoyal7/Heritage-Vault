  <!-- Keyhole -->
  <circle cx="36" cy="38.52" r="2.88" fill="url(#bg)" opacity="0.8"/>
  <rect x="34.92" y="38.52" width="2.16" height="5.040000000000001" rx="0.72" fill="url(#bg)" opacity="0.8"/>
</svg>