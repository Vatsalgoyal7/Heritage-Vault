    Q 56.160000000000004 59.04 36 63.36
    Q 15.84 59.04 15.84 37.44
    L 15.84 21.599999999999998
    Z
  " fill="url(#shield)" filter="url(#glow)"/>
  <!-- Lock body -->
  <rect x="27.36" y="33.120000000000005" width="17.28" height="15.84" rx="2.88" ry="2.88" fill="white" opacity="0.95"/>
  <!-- Lock shackle -->
  <path d="M 28.8 33.120000000000005 Q 28.8 21.599999999999998 36 21.599999999999998 Q 43.199999999999996 21.599999999999998 43.199999999999996 33.120000000000005" 
