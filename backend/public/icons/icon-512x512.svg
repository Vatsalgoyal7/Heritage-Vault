<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="60%" style="stop-color:#9d5cf5"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10.24" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="76.8" ry="76.8" fill="url(#bg)"/>
  <!-- Shield -->
  <path d="
    M 256 92.16
    L 399.36 153.6
    L 399.36 266.24
    Q 399.36 419.84 256 450.56
    Q 112.64 419.84 112.64 266.24
    L 112.64 153.6
    Z
  " fill="url(#shield)" filter="url(#glow)"/>
  <!-- Lock body -->
  <rect x="194.56" y="235.52" width="122.88" height="112.64" rx="20.48" ry="20.48" fill="white" opacity="0.95"/>
  <!-- Lock shackle -->
  <path d="M 204.8 235.52 Q 204.8 153.6 256 153.6 Q 307.2 153.6 307.2 235.52" 
        fill="none" stroke="white" stroke-width="25.6" stroke-linecap="round" opacity="0.95"/>
  <!-- Keyhole -->
  <circle cx="256" cy="273.92" r="20.48" fill="url(#bg)" opacity="0.8"/>
  <rect x="248.32" y="273.92" width="15.36" height="35.84" rx="5.12" fill="url(#bg)" opacity="0.8"/>
</svg>